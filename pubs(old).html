<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications | Austin Luchsinger</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_molecular_16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_molecular_32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_molecular-180.png">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">Austin Luchsinger</a>
      <ul class="nav-menu">
        <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
        <li class="nav-item"><a href="teaching.html" class="nav-link">Teaching</a></li>
        <li class="nav-item"><a href="research.html" class="nav-link">Research</a></li>
        <li class="nav-item"><a href="pubs.html" class="nav-link active">Publications</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <h2>Peer Reviewed Publications</h2>

    <!-- sort buttons -->
    <div class="controls" style="margin:1rem 0;">
      <button onclick="sortNewestFirst()">Newest first</button>
      <button onclick="sortOldestFirst()">Oldest first</button>
    </div>


    <!-- bibtex-js looks for this -->
    <bibtex src="assets/mypubs.txt"></bibtex>

    <!-- Template for each entry -->
    <div class="bibtex_template">
      <div class="pub-item" style="margin-bottom: 1.25rem;">
        <!-- Title -->
        <div class="pub-title">
          <span class="title"></span>
        </div>

        <!-- Authors (single line preferred) -->
        <div class="pub-authors">
          <span class="author"></span>
        </div>

        <!-- Venue + Year -->
        <div class="pub-venue">
          <span class="if journal"><em><span class="journal"></span></em></span>
          <span class="if booktitle"><em><span class="booktitle"></span></em></span>
          <span class="if howpublished"><span class="howpublished"></span></span>
          <span class="if year">. <span class="year"></span>.</span>
        </div>

        <!-- Links -->
        <div class="pub-links">
          <span class="if url"><a class="url">[link]</a></span>
          <span class="if doi"><a class="doi">[doi]</a></span>
          <span class="if pdf"><a class="pdf">[pdf]</a></span>
        </div>
      </div>
    </div>


    <!-- bibtex-js will replace this with formatted entries -->
    <div class="bibtex_display"></div>
  </main>

  <footer class="container">
    <p>&copy; 2026 Austin Luchsinger | Made with ChatGPT</p>
  </footer>

  <!-- Load the bibtex-js script LAST -->
  <script src="js/bibtex_js.js"></script>

  <!-- Sorting Script -->
  <script>
    function extractYear(node) {
      const yEl = node.querySelector('.year');
      if (!yEl) return -Infinity;
      const y = parseInt((yEl.textContent || '').replace(/[^0-9]/g, ''), 10);
      return isNaN(y) ? -Infinity : y;
    }

    function sortRenderedPubs(order = 'desc') {
      const display = document.querySelector('.bibtex_display');
      if (!display) return;

      // bibtex-js renders entries as .bibtexentry (possibly nested)
      const entries = Array.from(display.querySelectorAll('.bibtexentry'));
      if (!entries.length) return;

      // Reorder the nodes inside their actual parent container
      const container = entries[0].parentElement;

      entries.sort((a, b) => {
        const ya = extractYear(a);
        const yb = extractYear(b);
        return order === 'asc' ? ya - yb : yb - ya;
      });

      entries.forEach(el => container.appendChild(el));
    }

    // Wait until bibtex-js has populated the DOM, even if it nests elements
    (function waitForBibtex() {
      const display = document.querySelector('.bibtex_display');
      if (!display) return;

      // If already rendered, sort now
      if (display.querySelector('.bibtexentry')) {
        sortRenderedPubs('desc'); // newest first
        return;
      }

      // Otherwise watch for inserted entries anywhere under .bibtex_display
      const obs = new MutationObserver(() => {
        if (display.querySelector('.bibtexentry')) {
          sortRenderedPubs('desc');
          obs.disconnect();
        }
      });
      obs.observe(display, { childList: true, subtree: true });
    })();

    // Hook up your buttons
    window.sortNewestFirst = () => sortRenderedPubs('desc');
    window.sortOldestFirst = () => sortRenderedPubs('asc');
  </script>

  <!-- Invert Numbering -->
  <script>
  function renumberDescending() {
    const entries = document.querySelectorAll('.bibtexentry');
    const total = entries.length;

    entries.forEach((el, i) => {
      // Assign a data-number = total - i
      el.setAttribute('data-number', total - i);
    });
  }

  // Call after sorting or when new entries load
  (function waitForBibtex() {
    const display = document.querySelector('.bibtex_display');
    if (!display) return;

    const obs = new MutationObserver(() => {
      if (display.querySelector('.bibtexentry')) {
        renumberDescending();
      }
    });
    obs.observe(display, { childList: true, subtree: true });
  })();
  </script>


</body>
</html>
