<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>amluchsinger</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --card: rgba(148, 163, 184, 0.08);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020617, #111827 45%, #0f172a);
        color: var(--fg);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        text-align: center;
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        background: var(--card);
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.35);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 4rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from amluchsinger.github.io</h1>
      <p>Your GitHub Pages site is live and ready for content.</p>
    </main>
  </body>
</html>
